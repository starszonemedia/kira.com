<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transparent Luxury TAP</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&display=swap');

*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  background:transparent!important;
  overflow:hidden;
}
body{
  display:grid;place-items:center;
  font-family:Cairo,sans-serif;
}

.tap{
  position:relative;
  width:300px;height:185px;
  display:grid;place-items:center;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* rotating luxury aura */
.aura,.aura2{
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(255,105,180,.34);
  pointer-events:none;
}
.aura{
  width:145px;height:145px;
  border-top-color:#ff7fbd;
  border-right-color:transparent;
  animation:rotate 5s linear infinite;
}
.aura2{
  width:170px;height:170px;
  border-bottom-color:#f4d19a;
  border-left-color:transparent;
  animation:rotateReverse 7s linear infinite;
}

/* little orbit particles */
.orbit{
  position:absolute;width:195px;height:195px;
  animation:rotate 8s linear infinite;
}
.dot{
  position:absolute;width:5px;height:5px;border-radius:50%;
  background:#ffd8ec;
  box-shadow:0 0 12px #ff5ba9;
}
.dot:nth-child(1){top:8px;left:50%}
.dot:nth-child(2){right:12px;top:48%}
.dot:nth-child(3){bottom:17px;left:29%}
.dot:nth-child(4){left:14px;top:30%}

/* THE ACTUAL TAP TEXT */
.tap-content{
  position:relative;
  z-index:5;
  text-align:center;
  transform:rotate(-3deg);
  animation:levitate 2.8s ease-in-out infinite;
  filter:drop-shadow(0 9px 14px rgba(0,0,0,.34));
}

.tap-word{
  direction:ltr;
  font-family:Georgia,serif;
  font-size:68px;
  line-height:.9;
  font-weight:900;
  letter-spacing:7px;
  color:#fff;
  position:relative;
  background:linear-gradient(
    100deg,
    #fff 0%,
    #fff 27%,
    #ff9ed0 43%,
    #fff 57%,
    #f3d59f 70%,
    #fff 84%
  );
  background-size:220% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:textShimmer 2.6s linear infinite;
  -webkit-text-stroke:1px rgba(255,255,255,.6);
}

/* moving light streak through TAP */
.tap-word:after{
  content:"";
  position:absolute;
  top:0;left:-35%;
  width:25%;height:100%;
  transform:skewX(-20deg);
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);
  filter:blur(4px);
  animation:sweep 2.8s ease-in-out infinite;
}

.tap-ar{
  margin-top:8px;
  font-size:25px;
  font-weight:800;
  letter-spacing:2px;
  color:#fff;
  text-shadow:
    0 2px 5px rgba(0,0,0,.55),
    0 0 16px rgba(255,76,158,.75);
  animation:arPulse 1.7s ease-in-out infinite;
}

.sub{
  margin-top:2px;
  direction:ltr;
  font-family:Arial,sans-serif;
  font-size:8px;
  letter-spacing:4px;
  color:rgba(255,255,255,.72);
  animation:subFade 2s ease-in-out infinite;
}

/* click ripple */
.ripple{
  position:absolute;
  width:20px;height:20px;
  border-radius:50%;
  border:2px solid #ff8ac5;
  pointer-events:none;
  animation:ripple .8s ease-out forwards;
}

/* floating hearts / stars */
.spark{
  position:absolute;
  z-index:10;
  pointer-events:none;
  color:#ffd9ed;
  font-size:15px;
  animation:spark 1.1s ease-out forwards;
  text-shadow:0 0 10px #ff4fa3;
}

.tap:active .tap-content{
  transform:rotate(-3deg) scale(.92);
  transition:.08s;
}

@keyframes rotate{to{transform:rotate(360deg)}}
@keyframes rotateReverse{to{transform:rotate(-360deg)}}
@keyframes levitate{
  0%,100%{transform:rotate(-3deg) translateY(0)}
  50%{transform:rotate(-3deg) translateY(-7px)}
}
@keyframes textShimmer{
  to{background-position:-220% center}
}
@keyframes sweep{
  0%,25%{left:-35%;opacity:0}
  42%{opacity:1}
  68%,100%{left:120%;opacity:0}
}
@keyframes arPulse{
  0%,100%{transform:scale(1);opacity:.92}
  50%{transform:scale(1.07);opacity:1}
}
@keyframes subFade{
  0%,100%{opacity:.45}
  50%{opacity:.9}
}
@keyframes ripple{
  from{transform:scale(.3);opacity:1}
  to{transform:scale(9);opacity:0}
}
@keyframes spark{
  0%{transform:translate(0,0) scale(.4);opacity:0}
  15%{opacity:1}
  100%{transform:translate(var(--x),var(--y)) scale(1.4);opacity:0}
}
</style>
</head>

<body>
<div class="tap" id="tap">
  <div class="aura"></div>
  <div class="aura2"></div>

  <div class="orbit">
    <i class="dot"></i><i class="dot"></i>
    <i class="dot"></i><i class="dot"></i>
  </div>

  <div class="tap-content">
    <div class="tap-word">TAP</div>
    <div class="tap-ar">تكبيس</div>
    <div class="sub">KEEP TAPPING ✦</div>
  </div>
</div>

<script>
const tap=document.getElementById('tap');

function effect(e){
  const r=tap.getBoundingClientRect();
  const x=(e.clientX ?? r.left+r.width/2)-r.left;
  const y=(e.clientY ?? r.top+r.height/2)-r.top;

  const ripple=document.createElement('span');
  ripple.className='ripple';
  ripple.style.left=(x-10)+'px';
  ripple.style.top=(y-10)+'px';
  tap.appendChild(ripple);
  setTimeout(()=>ripple.remove(),800);

  const symbols=['✦','✧','♡','⋆','·'];
  for(let i=0;i<5;i++){
    const s=document.createElement('span');
    s.className='spark';
    s.textContent=symbols[Math.floor(Math.random()*symbols.length)];
    s.style.left=x+'px';
    s.style.top=y+'px';
    s.style.setProperty('--x',(Math.random()*150-75)+'px');
    s.style.setProperty('--y',(-35-Math.random()*90)+'px');
    tap.appendChild(s);
    setTimeout(()=>s.remove(),1100);
  }

  if(navigator.vibrate) navigator.vibrate(10);
}
tap.addEventListener('pointerdown',effect);
</script>
</body>
</html>
